name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run deterministic core tests
        run: pytest -q
      - name: Import Streamlit app smoke test
        run: python -c "import app"
      - name: Smoke test Streamlit pages
        run: python -c "import runpy; [runpy.run_path(p) for p in ['pages/01_Ergonomics_and_BOQ.py','pages/02_Optimizers.py','pages/03_Materials_and_Products.py','pages/04_Plan_Calibration_and_Export.py','pages/05_Building_Physics.py','pages/06_Quotation_and_Execution.py']]"
