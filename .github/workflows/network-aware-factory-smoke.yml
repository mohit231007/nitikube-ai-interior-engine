name: Network Aware Factory Smoke

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  network-aware-factory-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run deterministic tests
        run: pytest -q
      - name: Smoke test network-aware whole-home page
        run: python -c "import runpy; runpy.run_path('pages/29_Network_Aware_Whole_Home_Factory.py')"
